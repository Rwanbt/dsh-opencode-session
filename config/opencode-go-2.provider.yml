# Exact OpenCode Go 2 provider configuration, including the reasoning levels the
# gateway advertises for each model (snapshot 2026-11-12, GET /zen/go/v1/models).
#
# Merge this block under `config.providers` of the `llm-pi-ai` row in
# ~/.dsh/profiles/<profile>/cordis.patch.yml. The API key is never stored here:
# keep OPENCODE_GO_2_API_KEY in the credential store (Models page) or replace the
# apiKeyEnv value with your own reference.

opencode-go-2:
